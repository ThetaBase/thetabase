# Release binaries for the `theta` CLI.
#
# The CLI is the product, so this is the distribution channel — not a
# convenience. Until this runs, a prospect who wants to try ThetaBase has no way
# to install it, which makes every acquisition channel a call to action nobody
# can follow (`docs/business/SALES-REVIEW.md`).
#
# Fires on a version tag, never on a branch. A release you cannot name is a
# release you cannot support, and `latest` is how somebody ends up unable to say
# which build a customer is running.

name: Release

on:
  push:
    tags: ["v*"]
  # So the build can be proved before a tag exists, without publishing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing must not cancel the others: a partial release that
      # is missing macOS is better information than no release at all.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            build: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            build: x86_64-apple-darwin
            os: macos-latest
          # `target` names the archive; `build` is what cargo is asked for.
          #
          # They differ on Linux on purpose. The released binaries are static
          # musl, because the gnu builds on `ubuntu-latest` carried a
          # GLIBC_2.39 requirement and refused to start on Debian 12, Ubuntu
          # 22.04, or Amazon Linux 2023 -- and could not run on Alpine at all.
          # The archive keeps the `-gnu` name because install.sh already
          # constructs that URL, and the linkage underneath is not something a
          # person downloading it has to care about.
          - target: x86_64-unknown-linux-gnu
            build: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            build: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            build: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build }}

      # `theta-proto` generates from a Cap'n Proto schema at build time.
      - name: Install capnp (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install capnp (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install capnp (Windows)
        if: runner.os == 'Windows'
        run: choco install capnproto --no-progress

      # musl needs its own linker, and the aarch64 one is a cross toolchain.
      #
      # `ring` and `blake3` both compile C, so a C compiler for the target is
      # required and not only a linker -- which is why `musl-tools` is here and
      # not just the target added to rustup.
      - name: musl toolchain
        if: endsWith(matrix.build, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: aarch64 musl cross toolchain
        if: matrix.build == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `--locked` refuses to update Cargo.lock. A released binary built from a
      # dependency tree nobody tested is a binary nobody tested.
      # Both binaries a user is told to run.
      #
      # This built `theta-cli` alone, while the documentation tells people to
      # put ThetaBase in their agent's tool list with `theta exec -- theta-mcp`
      # -- a binary the release did not ship. An instruction that names
      # something the download does not contain is the same class of defect as
      # a dead link, and harder to notice.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}             -p theta-cli -p theta-mcp

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="theta-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.build }}/release/theta" "dist/$name/"
          cp "target/${{ matrix.build }}/release/theta-mcp" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksums beside the artefact. A download nobody can verify is a
          # supply-chain step somebody else can take for us.
          #
          # Generated from inside `dist` so the file records the archive's own
          # name and nothing else. Run from the repository root it wrote
          # `<hash>  dist/theta-...tar.gz`, and install.sh verifies in a
          # temporary directory where no `dist/` exists -- so every install
          # failed with "checksum mismatch" on an archive that was perfectly
          # intact. The bytes were never wrong; the path was.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "theta-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.build }}/release/theta.exe" "dist/$name/"
          Copy-Item "target/${{ matrix.build }}/release/theta-mcp.exe" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # Same format as the unix side: hash, two spaces, bare filename.
          # `Get-FileHash` alone writes the hash and nothing else, which no
          # `sha256sum -c` can read -- and a checksum file that cannot be
          # checked is decoration.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. `workflow_dispatch` proves the build and stops.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Draft, deliberately. The release notes are the first thing many
          # people read about a version, and they should be written by somebody
          # rather than generated and published in the same breath.
          draft: true
          generate_release_notes: true
