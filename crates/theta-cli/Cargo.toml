[package]
name = "theta-cli"
description = "The `theta` CLI: login, context resolution, branches, schema proposals, audit review."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "FSL-1.1-MIT"
repository.workspace = true
publish.workspace = true
[lib]
name = "theta_cli"
path = "src/lib.rs"

[[bin]]
name = "theta"
path = "src/main.rs"

[dependencies]
ratatui.workspace = true
crossterm.workspace = true
theta-eject.workspace = true
theta-core.workspace = true
theta-identity.workspace = true
theta-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio.workspace = true
# The credential store, plus one platform backend per OS. Depending on the
# backends directly (rather than on the `keyring` wrapper) is what lets tests
# install an in-memory store and exercise the real code path.
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# `keychain` explicitly. The crate refuses to compile on macOS without one of
# `keychain` or `protected` chosen -- `compile_error!`, not a silent fallback --
# and nothing on this machine or in CI's Linux job notices, because neither
# builds for Apple. The first Apple build was the release workflow, on a tag,
# after the repository was public.
#
# `keychain` rather than `protected`: `protected` is the data-protection
# keychain, which needs an app group and a provisioning profile. A CLI has
# neither, and the file-based keychain is what `security(1)` and every other
# command-line tool on macOS already use.
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# The tokio runtime feature, to match the runtime this CLI already uses.
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
base64.workspace = true
