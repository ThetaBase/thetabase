[package]
name = "theta-mcp"
license = "FSL-1.1-MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "theta-mcp"
path = "src/main.rs"

[dependencies]
theta-cli = { path = "../theta-cli" }
theta-core.workspace = true
theta-proto.workspace = true
theta-query.workspace = true

# Query results cross the wire as Arrow IPC, and a tool that returned an opaque
# byte array would be a tool no model can use. Decoding is this crate's job
# because it is the only consumer that has to render rows as text.
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
thetad = { path = "../thetad" }
theta-identity.workspace = true
