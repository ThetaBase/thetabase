[package]
name = "thetad"
description = "ThetaBase storage engine daemon: one isolated instance per project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "FSL-1.1-MIT"
repository.workspace = true
publish.workspace = true
[[bin]]
name = "thetad"
path = "src/main.rs"

[dependencies]
theta-core.workspace = true
theta-storage.workspace = true
theta-query.workspace = true
theta-safety.workspace = true
theta-identity.workspace = true
theta-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
# The client side of signed writes lives in the tests: they build and sign an
# entry the way a caller would, because a test that asked the server to sign
# would be checking the server against itself.
ed25519-dalek.workspace = true
