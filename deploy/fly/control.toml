# The Control Plane.
#
# One app, and it does not hibernate. Everything else depends on it being
# reachable: `theta login`, project resolution, token minting, and the
# revocation list every instance polls. An instance that loses that poll stops
# serving in-flight traffic after REVOCATION_STALENESS_LIMIT_MS (15s), so a
# Control Plane cold start would be a fleet-wide outage rather than one slow
# request.
#
# That is why `min_machines_running` is 1 here and 0 for projects.

app = "thetabase-control"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile.control"

[env]
  RUST_LOG = "info"
  THETA_CONTROL_LISTEN = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true

  # Never stopped. See above.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Two machines, so a deploy is not an outage and a host failure is not either.
# `desired count 2` in the ECS guide this replaces, for the same reason.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets are set with `fly secrets set`, never here — this file is committed.
#
#   THETA_CONTROL_DATABASE_URL   Neon connection string
#   THETA_GITHUB_CLIENT_ID       OAuth app
#   THETA_CONTROL_KMS_KEY_ID     AWS KMS key ARN (root of trust)
#   AWS_ACCESS_KEY_ID              scoped to that key + the archive bucket
#   AWS_SECRET_ACCESS_KEY
#   THETA_STRIPE_SECRET_KEY      omit until billing is live
#   THETA_BILLING_WEBHOOK_SECRET omit until billing is live
