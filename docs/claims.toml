]
gate = "conformance"

[[claim]]
id = "an-expensive-query-is-refused-rather-than-narrowed"
kind = "guarantee"
statement = """
A query estimated above the project's cost ceiling is refused. It is never
silently narrowed, given a limit nobody asked for, or answered with a partial
result. Where the estimate came from a table nobody has analysed, the query is
admitted and marked as unmeasured rather than refused on the strength of a
default — and the spend budget then meters what it actually cost.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "6.3.2 Refusing is not correcting"
spec_quote = "A caller who receives half a result"
evidence = [
  "an_expensive_query_with_a_real_estimate_is_refused",
  "an_expensive_query_with_a_guessed_estimate_is_admitted_and_flagged",
  "a_refusal_says_it_refused_rather_than_narrowing",
  "a_ceiling_of_zero_disables_it_rather_than_refusing_everything",
]
gate = "adversarial"

[[claim]]
id = "a-thousand-branches-are-billed-as-a-thousand-branches-cost"
kind = "guarantee"
statement = """
A branch is charged for what only it holds. Structure shared between branches is
reported as a shared pool and charged to the project, so exclusive plus shared
equals the real total — a fork that changed nothing is charged nothing, and a
branch holding its own copy of everything is charged for it.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "6.3.3 Storage attribution charges what a branch actually holds"
spec_quote = "exclusive plus shared equals the real"
evidence = [
  "a_fork_that_changed_nothing_is_charged_nothing",
  "a_thousand_identical_forks_do_not_cost_a_thousand_times_one",
  "the_parts_sum_to_the_whole",
  "a_branch_that_overwrote_a_shared_key_holds_its_own_copy",
  "a_branch_holding_a_full_copy_is_charged_for_it",
  # Over the engine's real branch views rather than a constructed map — the
  # question "who is this row's sole owner" cannot be answered one branch at a
  # time, so which branches are in the map is the whole of the answer.
  "exclusive_plus_shared_equals_the_real_total",
  "a_row_two_branches_share_is_charged_to_neither_alone",
  "a_row_only_one_branch_can_see_is_charged_to_that_branch",
  "every_branch_appears_even_when_it_owns_nothing",
]
gate = "adversarial"

