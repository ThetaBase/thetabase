  "an_altered_record_is_detected_when_the_log_replays",
  "verify_chain_finds_an_edit_that_a_checkpointed_open_would_skip",
  "the_tampering_this_suite_does_is_invisible_to_the_checksum",
]
gate = "ops"
note = """
Writing a chain and reading one are different things, and this repo shipped the
first without the second for a while. SEC-8 closed it; the evidence is a replay
that goes red, not the presence of a `prev_hash` field. The third test is why
the first two count — it proves the tampering the suite does would sail past the
checksum, so the chain is what catches it.
"""

[[claim]]
id = "the-newest-entry-is-not-tamper-evident"
kind = "non-claim"
statement = """
The hash chain does not detect an edit to entries written since the last
external anchor. Nothing inside the log commits to the tail, so rewriting it is
indistinguishable from those writes never having happened. External anchoring
narrows this window to the anchoring interval — it does not close it, and an
instance that is not anchoring has the original, unbounded gap.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "7.1 The anchor closes the gap up to itself and not one entry further"
spec_quote = "The interval between anchors"

[[claim]]
id = "reads-do-not-degrade-with-branch-depth"
kind = "guarantee"
statement = """
Reading from a deeply forked branch costs what reading from `main` costs. A
branch is a view, not a chain to walk — no ancestor stack is consulted and no
copy-on-write layers are resolved in order, so branch topology never reaches
the read path.
"""
spec = "docs/specs/09-sla-performance.md"
section = "2.2 Reads do not degrade with branch depth"
spec_quote = "reading at depth 500 costs what reading at depth 0 costs"
evidence = ["a_read_does_not_get_slower_as_branches_deepen"]
gate = "sla"
note = """
Worth stating because the competition cannot. Columbia's BranchBench reports
5-4000x read degradation on this axis across PostgreSQL, DoltgreSQL, Neon,
TigerData and Xata - see `docs/COMPETITION.md` §4. The measurement here is on
ThetaBase's own operations and is *not* comparable to their numbers; what it
supports is the direction, not a ranking.
"""

[[claim]]
id = "branch-creation-is-constant-time"
kind = "guarantee"
statement = """
Creating a branch costs the same whether the parent holds a hundred rows or a
million. A fork shares the parent's state rather than copying it, so branch
creation is one log append and nothing else.
"""
spec = "docs/specs/09-sla-performance.md"
section = "2.1 Branch create is constant time, and the copy is deferred"
spec_quote = "**Branch creation no longer scales with anything.**"
evidence = ["forking_is_constant_time_whatever_the_parent_holds"]
gate = "sla"
note = """
True since M10.6 and not before: this was ~1.5us per realistic row, and the
spec's own latency table claimed "copy-on-write pointer, not data copy" while it
was a copy. Pair it with `the-first-write-to-a-branch-pays-for-its-copy`, which
is where the cost went - a page that states this one alone is describing half
the operation.
"""

[[claim]]
id = "writing-to-a-forked-branch-costs-what-writing-costs"
kind = "guarantee"
statement = """
A freshly forked branch is not slower to write to than any other. The rows live
in structurally-shared maps, so a write copies the path it touches and shares
everything else — there is no moment where a branch has to be made real.
"""
spec = "docs/specs/09-sla-performance.md"
section = "2.1 Branch create is constant time, and the copy is deferred"
spec_quote = "Forking a branch and writing to it costs what writing"
evidence = ["the_first_write_to_a_branch_costs_what_any_write_costs"]
gate = "sla"
note = """
An intermediate version of M10.6 shared the maps behind `Arc` and copied on
first write, which moved ~3,800us from the fork to the first write rather than
removing it - and that was reported as a limit, next to the fork number, because
claiming constant-time forks without it would have described half the operation.
Persistent maps removed it. The test that guards this inverted twice during
M10.6, which is what a planted-violation test is for.
"""

[[claim]]
id = "persistent-maps-cost-reads-a-constant-factor"
kind = "non-claim"
statement = """
The lookups underneath are not the fastest possible. A structurally-shared map
reads about 1.9x slower than a plain B-tree — 85 nanoseconds against 45 — and
writes about 2.5x. That is the price of forks that cost nothing, and it is paid
on every read.
"""
spec = "docs/specs/09-sla-performance.md"
section = "2.1 Branch create is constant time, and the copy is deferred"
spec_quote = "lookup is about 1.9× a `BTreeMap`'s"
note = """
Absorbed rather than invisible: `get` measures 104us p50 end-to-end against a
5ms target, so 40 nanoseconds is 0.04% of the budget. Say it anyway. A system
that trades read speed for branch speed should be the one to say so, rather than
leaving it for somebody to find with a profiler and conclude it was hidden.
"""

# ---------------------------------------------------------------------------
# What ThetaBase does not claim
#
# These carry no evidence, because absence is not testable — the spec citation
# is the proof, and it is the honest kind. They default to `must_appear`, which
# means the site build fails if one of them is not on the site. Dropping an
# awkward limitation has to be a decision recorded here.
# ---------------------------------------------------------------------------

[[claim]]
id = "not-strictly-serializable-across-projects"
kind = "non-claim"
statement = """
ThetaBase is not a distributed, strictly serializable system across projects.
Within a project there is nothing to be ACID across — one project is one log, one
process, one total order. Across projects there is deliberately nothing at all,
and that isolation is a security property rather than a consistency shortfall.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "4. What ThetaBase Does Not Claim"
spec_quote = "Not a distributed, strictly serializable system across projects."

[[claim]]
id = "no-cross-branch-transactions"
kind = "non-claim"
statement = """
No cross-branch distributed transactions in v1. You cannot debit one branch's
balance and credit another's in one atomic operation. A transaction is scoped to
one branch.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "4. What ThetaBase Does Not Claim"
spec_quote = "cross-branch distributed transactions"

[[claim]]
id = "reading-the-past-refuses-rather-than-approximates"
kind = "guarantee"
statement = """
Any query can be run as of a commit or a time. A point that retention has
expired is refused, with the earliest point still available — never answered from
the oldest state on hand. A query asked by timestamp reports which commit it
actually resolved to, because timestamps are advisory and the two are not the
same thing.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "`AS OF` refuses below the retention horizon"
spec_quote = "never answered from the earliest state available"
evidence = [
  "a_branch_can_be_read_as_it_was",
  "a_point_below_the_retention_horizon_is_refused_rather_than_approximated",
  "a_timestamp_query_says_which_commit_it_actually_got",
  "a_timestamp_before_the_first_entry_is_refused_rather_than_returning_nothing",
]
gate = "consistency"

[[claim]]
id = "a-change-feed-never-hides-a-gap"
kind = "guarantee"
statement = """
Changes between any two points come back as rows, carrying the old value as well
as the new — including for a removal, so the value that is gone is in the diff. A
change-data-capture consumer that has been away longer than retention keeps
history is told it has a gap rather than silently resumed from wherever history
now begins.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "Change data capture is the same fold, streamed"
spec_quote = "Resuming from wherever history now begins"
evidence = [
  "a_diff_carries_the_value_that_was_removed",
  "a_diff_carries_both_sides_of_a_change",
  "a_consumer_that_was_away_too_long_is_told_rather_than_silently_resumed",
  "a_consumer_exactly_at_the_horizon_is_not_told_it_lost_anything",
  "a_write_that_changes_nothing_produces_no_change",
]
gate = "consistency"

[[claim]]
id = "time-travel-is-bounded-by-retention"
kind = "non-claim"
statement = """
Time travel is bounded by your retention policy, not infinite. The default is
`Forever` and it is a supportable default rather than an aspiration — the archive
compresses log-shaped segments about 53× with a verified byte-identical restore —
but a policy with a window means history outside that window is gone.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "4. What ThetaBase Does Not Claim"
spec_quote = "bounded by log retention policy, not infinite"
note = """
Replaces `[[retired]] bounded-time-travel`, which undersold this once the default
became `Forever`. Both directions matter: overselling loses a customer's history,
underselling loses the customer.
"""

[[claim]]
id = "expiry-removes-a-prefix-never-a-hole"
kind = "non-claim"
statement = """
When retention does expire history, it removes a contiguous prefix and never a
hole. A missing segment in the middle would fold into a state that never existed
and would look entirely normal, so expiry stops at the first segment still inside
the window, refuses to empty the archive, and reports the earliest restorable
point rather than failing halfway through a restore.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "4. What ThetaBase Does Not Claim"
spec_quote = "contiguous prefix and never a hole"

[[claim]]
id = "no-availability-sla-yet"
kind = "non-claim"
statement = """
There is no availability SLA, and there will not be one until a full production
quarter of real telemetry exists. A number invented before the data exists is
exactly the unvalidated claim this whole build process is designed to avoid.
"""
spec = "docs/specs/09-sla-performance.md"
section = "6. Explicit Caution"
spec_quote = "until at least one full production quarter of real telemetry exists"

[[claim]]
id = "no-prompt-injection-defence-in-the-agent"
kind = "non-claim"
statement = """
ThetaBase does not defend your agent against prompt injection — that is the agent
framework's job. What it does is narrower and load-bearing: a successfully
manipulated agent still cannot cause unreviewed destructive damage or unbounded
cost, because the Safety Layer reads the change and never the prompt.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "6. Explicit Non-Goals for v1"
spec_quote = "Not providing agent-runtime-level prompt-injection defenses"

[[claim]]
id = "no-defence-against-a-compromised-hypervisor"
kind = "non-claim"
statement = """
ThetaBase does not defend against a compromised host OS or hypervisor at the
infrastructure provider. That is the standard shared-responsibility boundary and
it is worth stating rather than leaving to be assumed.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "6. Explicit Non-Goals for v1"
spec_quote = "Not defending against a fully compromised host OS/hypervisor"

[[claim]]
id = "encryption-does-not-cover-the-audit-log"
kind = "non-claim"
statement = """
Encryption at rest does not cover `audit.jsonl`. The Safety Layer's audit log
sits in the same directory in clear, and holds change summaries and schema
identifiers — table and column names, risk classifications, who proposed what —
but no row values. Smaller than the log, and still an exposure.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "3. Tenant Isolation"
spec_quote = "Not covered: `audit.jsonl`"
note = """
Named on the page rather than left to be discovered, because a reader who has
just been told "encryption at rest" will not go looking.
"""

[[claim]]
id = "encryption-does-not-defend-against-key-access"
kind = "non-claim"
statement = """
Encryption at rest protects a stolen segment file, a backup or volume snapshot
taken without the key, a decommissioned disk, an over-broad replica. It does not
protect against anyone who can read the key alongside the data. Where the key is
kept is therefore the whole question, and it is your deployment decision.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "3. Tenant Isolation"
spec_quote = "anyone who can read the key alongside the data"

# ---------------------------------------------------------------------------
# Retired wordings
#
# Phrasings that were true once. Copy gets reused, and the most likely source of
# a false claim on a new page is an old page — so these are searched for in site
# content and fail the build on sight.
# ---------------------------------------------------------------------------

[[retired]]
id = "no-linearizability"
wording = "Global linearizability for concurrent writers to one key"
why = """
Wrong in both directions since M10.5. Writes to a branch *are* totally ordered,
and what was actually missing was atomic read-modify-write — a narrower and more
useful thing to say. The escape hatch is `putIf`, not an explicit transaction.
"""
replaced_by = "totally-ordered-writes"

[[retired]]
id = "bounded-time-travel"
wording = "Bounded means bounded"
why = """
Undersells the product since M10.5. Retention is a real policy whose default is
`Forever`, so "bounded" as an unqualified limitation reads as a smaller promise
than the one being made.
"""
replaced_by = "time-travel-is-bounded-by-retention"

[[retired]]
id = "encrypted-at-rest-unqualified"
wording = "all data is encrypted at rest"
why = """
Encryption at rest is per-deployment and off by default; a server with no key
writes in clear and says so at startup. An unqualified sentence describes a
product that is not the one shipping, which is the specific failure SEC-2 was
raised for.
"""
replaced_by = "per-project-encryption-keys"

[[retired]]
id = "pluggable-archive-before-a-second-backend"
wording = "bring your own object storage"
why = """
The one conditional retirement here. M10's S3-compatible backend has since
shipped and runs the same backend contract AT-1 does, so a second real
implementation exists — but the phrase stays retired until a page actually names
it next to AT-1. `ArchiveBackend` being a trait was never the same as a reader
having a choice, and "AT-1 is recommended" is not a recommendation while it is
the only option. Lift this entry in the commit that writes that page, not before.
"""
