[[claim]]
id = "an-unknown-wire-value-is-read-as-the-strictest-one"
kind = "guarantee"
statement = """
A gate, rule or remedy that a client build does not recognise comes from a newer
server, and is read as the strictest value rather than the most permissive one.
An older client can therefore be wrong about a decision only in the direction of
asking for more review, never less.
"""
