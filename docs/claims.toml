# What ThetaBase is allowed to say about itself.
#
# ROADMAP M11.5 sets one rule for every customer-facing page: **no claim ships
# that a gate does not prove.** This file is that rule made mechanical, because
# the review-step version of it already failed once — see the module docs in
# `crates/theta-claims/src/lib.rs` for the two entries that went stale within a
# day of M10.5 landing, and the `[[retired]]` section at the bottom for what
# they said.
#
# Each entry pins a sentence on the site to a sentence in a spec:
#
#   statement    what a page may say, in a reader's language
#   spec/section where it comes from — cited on the page, so it must resolve
#   spec_quote   words that must still appear verbatim in that section
#   evidence     the test functions that prove it
#   gate         the `make` target those tests run under
#
# `spec_quote` is the tripwire. Reword the spec and it stops matching, the build
# goes red, and whoever changed the spec is shown the page that depended on it.
# So quote the words that would *change* if the guarantee changed.
#
# Adding a claim is cheap. Adding one whose evidence does not exist is not
# possible, which is the point.

# ---------------------------------------------------------------------------
# Guarantees
# ---------------------------------------------------------------------------

[[claim]]
id = "a-stale-replica-redirects-rather-than-answering"
kind = "guarantee"
statement = """
A read replica that has not yet caught up with a write you have already seen
does not serve you an older value. You name the version you last saw, per key,
and a replica below it redirects instead of answering — so a lagging replica
costs a round trip and never a wrong answer.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "Follower reads with a version floor"
spec_quote = "becomes a **redirect**, never a wrong answer"
evidence = [
  "a_stale_replica_redirects_rather_than_answering",
  "the_floor_is_per_key_so_one_lagging_key_does_not_redirect_everything",
  "a_key_the_replica_has_never_seen_is_behind_rather_than_at_version_zero",
  "a_key_the_replica_does_not_have_is_served_as_absent_not_as_version_zero",
  "a_caller_cannot_lower_its_own_floor",
]
gate = "consistency"

[[claim]]
id = "a-region-writes-locally-without-weakening-a-guarantee"
kind = "guarantee"
statement = """
Each region writes to its own branch, so a write is local and needs no
cross-region round trip. Read-your-writes holds within a region because a region
is a branch; across regions you see another region's writes after a merge, which
is what a branch has always meant. Total order within a branch is unchanged.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "Regional branches"
spec_quote = "rather than a new weakening"
evidence = [
  "a_caller_is_routed_to_their_regions_branch",
  "an_unplaced_region_is_refused_rather_than_sent_home",
  "a_region_cannot_be_silently_replaced",
  "a_region_that_has_never_merged_is_lagging_rather_than_current",
  # Through the engine, where a placement can name a branch that does not exist
  # and where "you see another region's writes after a merge" is a fact about
  # real branch views rather than about a routing table.
  "a_write_routes_to_the_branch_its_region_is_placed_on",
  "regions_write_to_their_own_branches_without_seeing_each_others_writes_yet",
  "a_region_cannot_be_placed_on_a_branch_that_does_not_exist",
  "placing_a_region_twice_is_refused_rather_than_replacing_the_first",
]
gate = "consistency"

[[claim]]
id = "thetabase-is-multi-region-and-not-multi-master"
kind = "non-claim"
statement = """
Concurrent writers to the *same branch* in different regions are not supported.
Regions get their own branches and merge explicitly, which gives local writes
and local reads; what it does not give is two regions writing one key at the
same instant with nobody arbitrating. Building that would multiply the rate at
which conflicts reach a human, and would change what
`totally-ordered-writes` means — so it is a decision recorded in
`DECISION-single-branch-multi-master.md` rather than a feature deferred quietly.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "Multi-region: regional branches and follower reads"
spec_quote = "is **not** multi-master, and the difference is"

[[claim]]
id = "read-your-writes"
kind = "guarantee"
statement = """
A client always reads its own writes. There is no window in which a write you
just acknowledged is not there yet for you.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.1 Within a branch"
spec_quote = "always, for the client that performed the write"
evidence = ["a_session_always_reads_its_own_writes"]
gate = "consistency"

[[claim]]
id = "strong-eventual-consistency"
kind = "guarantee"
statement = """
Every reader of a branch that has seen the same operations sees the same state.
This is provable from the log and CRDT design rather than asserted.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.1 Within a branch"
spec_quote = "all replicas converge to the same state"
evidence = [
  "branches_converge_regardless_of_merge_direction",
  "converged_state_survives_a_restart",
]
gate = "consistency"

[[claim]]
id = "totally-ordered-writes"
kind = "guarantee"
statement = """
Writes to a branch are totally ordered. Concurrent writes to one key do not
interleave: every one of them succeeds, and the surviving value is always one
somebody wrote — never a blend, never a missing key.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.1 Within a branch"
spec_quote = "concurrent writes to the same key do not interleave"
evidence = ["concurrent_writers_to_one_key_serialize_to_one_of_their_values"]
gate = "consistency"
note = """
This replaced a weaker and wronger claim; see `[[retired]] no-linearizability`.
A total order is not the same as atomic read-modify-write, which is a separate
claim (`conditional-write`) precisely because conflating them is the mistake the
retired wording made.
"""

[[claim]]
id = "conditional-write"
kind = "guarantee"
statement = """
Read-modify-write has a precondition and does not lose updates. `putIf` requires
the row to be absent, or at exactly the version your read returned; the check and
the append happen in the same call, and a refusal carries the row's current
version so a retry costs no extra round trip.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.1 Within a branch"
spec_quote = "checked in the same call that appends"
evidence = [
  "a_contended_counter_loses_no_increment",
  "the_same_contention_without_a_precondition_loses_updates",
  "a_conditional_write_is_refused_when_the_row_moved_underneath_it",
]
gate = "consistency"
note = """
The second test is the one that makes the first evidence: it runs the identical
contention without a precondition and requires updates to be lost. A passing
concurrency test that would also pass on a broken implementation proves nothing.
"""

[[claim]]
id = "compare-and-set-is-not-raceable"
kind = "guarantee"
statement = """
The precondition is evaluated and the write appended under one exclusive borrow
of the engine, so nothing can write to the branch in between.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.3 Transactions"
spec_quote = "A precondition that could be raced is not a precondition."
evidence = ["create_only_succeeds_once_and_refuses_after"]
gate = "consistency"

[[claim]]
id = "single-key-atomicity"
kind = "guarantee"
statement = """
Single-key operations are atomic by construction, because a log append is atomic.
A write either happened or it did not; there is no third state to recover from.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.3 Transactions"
spec_quote = "Single-key operations are atomic by construction"
evidence = [
  "a_failed_append_leaves_the_view_untouched",
  "a_torn_final_record_is_dropped_and_never_resurrected",
]
gate = "consistency"

[[claim]]
id = "branch-isolation"
kind = "guarantee"
statement = """
A branch is fully isolated until it merges. Nothing on one branch can see
another branch's uncommitted writes, even partially.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.2 Across branches"
spec_quote = "no partial visibility of another branch's uncommitted writes"
evidence = [
  "a_new_branch_inherits_its_parents_state_and_then_diverges",
  "per_branch_views_survive_a_restart",
]
gate = "consistency"

[[claim]]
id = "a-converging-field-is-written-by-operation-never-by-value"
kind = "guarantee"
statement = """
A CRDT-typed row is mutated through its own request carrying an operation, not
through `put` carrying a value. An operation whose shape disagrees with the
field's declared kind is refused before it reaches the log, rather than appended
and recorded as rejected while the caller is told the write succeeded.
"""
spec = "docs/specs/01-system-architecture.md"
section = "3.3.1 A converging field is written by operation, never by value"
spec_quote = "reconciled without choosing one"
evidence = [
  "a_counter_can_be_written_and_read_back",
  "a_mutation_that_disagrees_with_the_declared_kind_is_refused_not_appended",
  "a_mutation_that_disagrees_with_what_the_row_already_is_is_refused",
  "two_inserts_get_distinct_server_assigned_element_ids",
  "an_element_can_be_removed_by_the_id_the_caller_read",
  "a_crdt_write_counts_against_the_blast_radius_breaker",
  "a_crdt_write_is_attributed_like_any_other",
]
gate = "consistency"

[[claim]]
id = "deterministic-crdt-merge"
kind = "guarantee"
statement = """
Merging CRDT-typed fields is deterministic and order-independent. Merging in
either direction gives the same answer, and merging twice changes nothing.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.2 Across branches"
spec_quote = "Merge is deterministic for CRDT-typed fields"
evidence = [
  "crdt_merges_converge_regardless_of_direction",
  "merging_twice_changes_nothing",
  "counter_merges_are_order_independent_and_lossless",
  # The three above build CRDT state directly, because until the write path
  # landed no caller could produce any. They establish that the merge function
  # converges; they could not establish that this guarantee was reachable. These
  # two drive both sides through `apply_crdt` and merge the branches normally.
  "two_branches_incrementing_the_same_counter_converge_on_merge",
  "a_set_converges_on_the_union_of_concurrent_additions",
  "concurrent_increments_are_not_reported_as_a_conflict",
]
gate = "consistency"

[[claim]]
id = "an-agent-is-told-it-will-conflict-before-it-moves-on"
kind = "guarantee"
statement = """
When many agents work from one branch, a merge that will not land is refused
when it joins the queue rather than when it reaches the front — and it is told
which queued merge it disagrees with. The check is against the target as it will
be once everything ahead has landed, not as it is now.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "Merge queues, and what \"clean\" is checked against"
spec_quote = "An agent that will conflict is told at enqueue."
evidence = [
  "a_conflict_with_a_queued_merge_is_found_at_enqueue_not_at_merge",
  "forty_nine_agents_writing_one_key_are_told_at_enqueue",
  # Through the engine, which is where the target and the source views come
  # from. The unit tests speculate against a store they were handed; these check
  # that the store handed over is the right branch's.
  "the_second_merge_is_speculated_against_the_first_and_not_against_the_target",
  "a_merge_is_speculated_against_its_own_target_and_not_against_main",
  "a_conflicting_merge_is_told_which_branch_is_ahead_of_it",
  "revalidation_evicts_a_merge_that_stopped_being_clean_rather_than_forcing_it",
  "a_branch_with_nothing_to_merge_is_told_so_rather_than_queued",
  "a_merge_that_stops_being_clean_is_evicted_rather_than_landed",
  "the_same_conflict_against_the_target_itself_reports_no_ticket",
  "two_agents_adding_different_columns_both_queue",
]
gate = "consistency"

[[claim]]
id = "what-an-agent-says-about-itself-cannot-be-edited-later"
kind = "guarantee"
statement = """
A log entry can carry what an agent said about itself — which agent, which
instruction, which task. It is self-reported and no gate reads it, but it is
hashed into the entry, so it cannot be added, removed or altered afterwards
without breaking the chain. The instruction is stored as a hash, never as text.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "6. Agent identity in the log"
spec_quote = "A prompt hash, never a prompt"
evidence = [
  "adding_or_removing_provenance_breaks_the_entrys_hash",
  "a_prompt_hash_is_carried_and_a_prompt_is_not",
  "an_agent_with_no_provenance_hashes_exactly_as_it_did_before_the_field_existed",
  "everything_one_session_did_is_one_query",
  "a_task_id_and_a_session_id_are_different_namespaces",
]
gate = "consistency"

[[claim]]
id = "the-embedded-build-has-the-same-gate"
kind = "guarantee"
statement = """
ThetaBase embedded in your process is the same engine, with the same Safety Layer.
A destructive change is classified and refused exactly as it would be on a
server; there is no flag, no configuration and no build option that turns the
gate off, and confirmation is still not sufficient at the shadow gate.
"""
spec = "docs/specs/01-system-architecture.md"
section = "The gate comes along; the caller answers it"
spec_quote = "no `auto_confirm` flag, no `force`"
evidence = [
  "the_gate_is_the_same_gate_and_there_is_no_flag_that_turns_it_off",
  "confirmation_is_not_sufficient_at_the_shadow_gate_here_either",
  "opening_requires_a_policy_rather_than_defaulting_to_one",
]
gate = "adversarial"

[[claim]]
id = "embedding-drops-real-guarantees-and-says-which"
kind = "non-claim"
statement = """
An embedded deployment does not have cross-project isolation, token scoping or
revocation, a managed archive, or an audit trail the caller cannot edit. Two
projects opened in one process share an address space — that is the absence of
the hosted isolation guarantee, not a weaker version of it.
"""
spec = "docs/specs/01-system-architecture.md"
section = "What embedding does not give you"
spec_quote = "projects opened in it share an address space"

[[claim]]
id = "a-synced-entry-keeps-its-proof-of-authorship"
kind = "guarantee"
statement = """
Synchronising two independent ThetaBase instances carries entries between logs and
re-appends them, which changes their position in the chain. An entry's signature
survives that, because a signature covers what the entry says rather than where
it sits. Sync resolves nothing: two sides that wrote the same key independently
are reported as a conflict for a human, never picked between.
"""
spec = "docs/specs/01-system-architecture.md"
section = "Sync is not merge"
spec_quote = "Signatures cover content, not chain position."
evidence = [
  "a_synced_entry_keeps_its_proof_of_authorship",
  "rebasing_changes_only_the_link_and_nothing_it_was_signed_over",
  "a_key_both_sides_wrote_independently_is_a_conflict_and_nothing_is_applied",
  "an_entry_both_sides_hold_is_recognised_despite_different_chain_positions",
  "syncing_twice_carries_nothing_the_second_time",
]
gate = "consistency"

[[claim]]
id = "conflicts-go-to-a-human"
kind = "guarantee"
statement = """
Anything that is not CRDT-typed and conflicts stops and asks. The system never
proceeds past a conflict, never guesses, and never asks a model.
"""
spec = "docs/specs/03-data-model-consistency.md"
section = "3.2 Across branches"
spec_quote = "never proceeds past a conflict without resolution"
evidence = [
  "two_plain_writes_to_one_field_are_an_explicit_conflict",
  "a_conflicted_merge_carries_no_applicable_operations",
  "divergent_plain_writes_never_merge_silently",
]
gate = "consistency"

[[claim]]
id = "no-llm-on-the-hot-path"
kind = "guarantee"
statement = """
No read, write, or typed query ever reaches a language model. This is enforced
by a test over the dependency graph, not by discipline: adding an HTTP or model
client anywhere in the hot path's dependency closure fails the build.
"""
spec = "docs/specs/09-sla-performance.md"
section = "1. Principle"
spec_quote = "must never depend on an LLM call"
evidence = [
  "no_model_or_http_client_exists_anywhere_in_the_hot_paths_dependency_closure",
  "the_walk_finds_a_client_several_hops_away",
]
gate = "hotpath"
note = """
The second test is the planted violation: it feeds the same walk a graph with a
client several hops away and requires it to be found. Without it, the first test
would pass just as happily if the walk were broken.
"""

[[claim]]
id = "rule-based-safety-classification"
kind = "guarantee"
statement = """
Whether a change is destructive is decided by rules, not by a model. The
classifier reads the change kind, row impact, reversibility and branch
protection — and never the text of an identifier, so there is nothing in it to
prompt-inject.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "9. What This Layer Explicitly Does Not Do"
spec_quote = "classification is rule-based and deterministic"
evidence = [
  "classification_is_deterministic_across_repeated_runs",
  "an_identifier_carrying_instructions_does_not_change_the_classification",
  "an_injected_identifier_cannot_forge_a_line_in_the_audit_trail",
  "identifier_text_cannot_change_any_classification",
]
gate = "adversarial"

[[claim]]
id = "the-decision-table-has-no-holes-or-inversions"
kind = "guarantee"
statement = """
The safety classifier's decision table is checked as a whole, not sampled.
Every input produces a gate; making a change worse — more rows, a protected
branch, a stricter policy — never produces a weaker gate; and every gate is
still reachable. These are properties of the whole function, which is why they
are verified by enumeration rather than by a corpus of examples.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "4.1 Properties of the decision table"
spec_quote = "Making a change worse never makes its gate weaker."
evidence = [
  "every_reachable_combination_produces_a_defensible_gate",
  "making_a_change_worse_never_weakens_its_gate",
  "every_gate_is_reachable_and_the_strongest_boundary_is_live",
  "the_ambiguity_policy_cannot_reach_a_destructive_change",
]
gate = "adversarial"

[[claim]]
id = "an-exhausted-review-budget-refuses-rather-than-downgrades"
kind = "guarantee"
statement = """
ThetaBase meters how much human review an agent can demand, per project, per
branch and per agent. Running out refuses the proposal — it never approves one,
never downgrades a gate, and never turns a change needing shadow validation into
one a confirmation clears. A change that needs no human is free, so safe work is
never throttled.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "6.1.3 Exhaustion refuses; it never downgrades"
spec_quote = "Exhausting a budget refuses a proposal."
evidence = [
  "a_refused_proposal_is_refused_and_never_downgraded",
  "an_auto_applied_change_costs_nothing_however_many_of_them_there_are",
  "a_stricter_gate_never_costs_less_than_a_weaker_one",
  "one_agents_exhaustion_does_not_starve_another",
]
gate = "adversarial"

[[claim]]
id = "a-batch-is-gated-at-its-strongest-member"
kind = "guarantee"
statement = """
Related changes can be reviewed together, and batching one dangerous change with
harmless ones never lets it inherit their approval. A batch carries the gate of
its strictest member, costs no less than that member reviewed alone, and leaves
every member's own classification untouched.
"""
spec = "docs/specs/07-agent-safety-layer.md"
section = "6.2 Batching and Triage"
spec_quote = "A batch is gated at its strongest member"
evidence = [
  "a_batch_is_gated_at_its_strongest_member_whatever_order_they_arrive_in",
  "batching_never_changes_a_members_own_gate",
  "a_batch_never_costs_less_than_its_worst_change_alone",
  "triage_never_drops_a_change",
  "changes_to_different_tables_are_never_batched_together",
  # Through the engine's own queue, which is where the changes come from a
  # HashMap and the ordering guarantee has to survive.
  "the_queue_holds_everything_waiting_and_hides_nothing",
  "a_batch_carries_the_gate_of_its_strongest_member",
  "two_engines_given_the_same_proposals_in_different_orders_show_the_same_queue",
  "a_batch_names_the_change_driving_its_gate",
]
gate = "adversarial"

[[claim]]
id = "a-gated-change-says-what-would-unblock-it"
kind = "guarantee"
statement = """
When ThetaBase refuses a change, it says why as data rather than as prose: which
rule fired, on which numbers, and what would let the change proceed. The
explanation carries no identifier text, and it never suggests an action that
cannot work — an irreversible change is never told to make itself smaller, and a
change at the shadow gate is never offered a confirmation that would be refused.
"""
