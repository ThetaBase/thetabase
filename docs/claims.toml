[[claim]]
id = "an-author-is-a-claim-the-log-can-check"
kind = "guarantee"
statement = """
A write can be signed with a key the server never holds, so `author` stops being
something the server merely asserts. The caller builds the entry and the server
appends it verbatim: it never assembles an entry and attaches the caller's
signature, because a signature over something the signer never saw proves only
that the server is consistent with itself. Verification is driven by the entries
that were expected to be signed, so a stripped signature is a failure rather than
an absence.
"""
spec = "docs/specs/04-threat-model-security.md"
section = "7.2 Signing protects a customer from us, not from their agent"
spec_quote = "makes the author a claim the log can check"
evidence = [
  "a_correctly_signed_write_lands",
  "a_signature_from_the_wrong_key_is_refused",
  "a_signature_over_a_different_value_does_not_cover_the_one_sent",
  "a_signature_filed_under_a_key_that_is_not_the_authors_is_refused",
  "a_session_with_no_registered_key_cannot_sign",
  "a_write_signed_for_a_commit_somebody_else_took_is_refused_and_retryable",
  "a_timestamp_far_from_the_instances_clock_is_refused",
  "verification_is_driven_by_the_entries_not_by_the_signatures_present",
  "a_signature_that_does_not_verify_is_not_left_in_the_book",
  # A signature says who wrote something, never that they were allowed to.
  "a_signed_write_is_still_type_checked",
  "a_forged_write_is_refused_before_it_can_spend_breaker_budget",
  # And end to end, over a socket, which is the only place the server actually
  # *learns* the key — it comes off the session token, and nothing else in the
  # suite exercises that. A signing scheme whose key never arrives refuses every
  # honest write.
  "a_signed_write_lands_with_the_key_the_token_carried",
  "a_forged_signature_is_rejected_over_the_wire",
  "a_session_whose_token_carries_no_key_cannot_sign",
  "a_write_signed_for_a_position_that_moved_comes_back_as_a_conflict",
  "a_signed_put_and_an_ordinary_put_read_the_value_field_the_same_way",
]
gate = "adversarial"

[[claim]]
id = "a-signature-proves-the-key-holder-not-the-person"
