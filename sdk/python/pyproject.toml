[project]
name = "thetabase"
version = "0.0.1"
description = "ThetaBase Python SDK — the agent-native database client."
readme = "README.md"
requires-python = ">=3.10"
# No licence chosen yet; see docs/DISTRIBUTION.md.
license = { text = "Proprietary" }
# PyPI refuses any distribution carrying this classifier. A publish is a
# public disclosure, and disclosure ends patent rights outside the US.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thetabase"]

[tool.ruff]
line-length = 100
target-version = "py310"
